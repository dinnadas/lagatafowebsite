<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel Access</title>
    <!-- Google Font for styling -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #6e7e92, #3f4a56);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            transform: translateY(-50px);
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #1abc9c;
            font-weight: 700;
            letter-spacing: 2px;
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
            color: #dfe6e9;
        }

        .btn-start {
            padding: 18px 36px;
            background: linear-gradient(135deg, #1abc9c, #16a085);
            color: white;
            font-size: 22px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 15px rgba(26, 188, 156, 0.4);
            transition: transform 0.3s, box-shadow 0.3s, background 0.4s ease;
        }

        .btn-start:hover {
            background: linear-gradient(135deg, #16a085, #1abc9c);
            box-shadow: 0 10px 20px rgba(26, 188, 156, 0.5);
            transform: scale(1.05);
        }

        .btn-start:focus {
            outline: none;
        }

        .btn-start:active {
            transform: scale(1);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Admin Panel Access</h1>
        <p>It seems you are trying to open the site's admin panel. If you are the admin, please press the "Start" button below to log in.</p>
        <a href="login.php" class="btn-start">Start</a>
    </div>

</body>

</html>
